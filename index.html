    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {

                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1'
                        },
                        ai: {
                            500: '#8b5cf6',
                            600: '#7c3aed'
                        },
                        school: {
                            500: '#10b981',
                            600: '#059669'
                        }
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'Tahoma', 'sans-serif']
                    }
                }
            }

    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

/* =========================================================
   تنظیمات اصلی سایت
========================================================= */

const CARD_NUMBER = "6219861852084200";
const CARD_OWNER = "نام صاحب کارت";

const INITIAL_STATE = {
    currentUser: null,

    users: [],

    otpRequests: [],

    schoolPacks: [],

    aiPacks: [],

    orders: [],

    messages: [],

    reviews: []
};


/* =========================================================
   Toast
========================================================= */

function Toast({ msg, type, onClose }) {

    useEffect(() => {

        const timer = setTimeout(() => {
            onClose();
        }, 3500);

        return () => clearTimeout(timer);

    }, []);

    return (
        <div
            className={
                "fixed bottom-5 left-5 z-[100] px-5 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-3 " +
                (type === "error"
                    ? "bg-rose-600"
                    : "bg-emerald-600")
            }
        >

            <span>{msg}</span>

            <button
                onClick={onClose}
                className="hover:opacity-75"
            >
                ✕
            </button>

        </div>
    );
}


/* =========================================================
   برنامه اصلی
========================================================= */

function App() {

    const [state, setState] = useState(() => {

        try {

            const saved =
                localStorage.getItem("site_app_data_v14");

            if (saved) {
                return JSON.parse(saved);
            }

            return INITIAL_STATE;

        } catch (error) {

            console.error(error);

            return INITIAL_STATE;
        }
    });


    const [view, setView] = useState("welcome");

    const [toast, setToast] = useState(null);

    const [pendingSignup, setPendingSignup] = useState(null);

    const [selectedProduct, setSelectedProduct] = useState(null);

    const [searchTerm, setSearchTerm] = useState("");

    const [schoolGradeFilter, setSchoolGradeFilter] =
        useState("همه");

    const [aiCategoryFilter, setAiCategoryFilter] =
        useState("همه");


    /* =====================================================
       ذخیره اطلاعات
    ===================================================== */

    useEffect(() => {

        try {

            localStorage.setItem(
                "site_app_data_v14",
                JSON.stringify(state)
            );

        } catch (error) {

            console.error(
                "خطا در ذخیره اطلاعات:",
                error
            );

        }

    }, [state]);


    /* =====================================================
       اطلاعات مدیر
    ===================================================== */

    const ADMIN_USER =
        "محمد معين سليم صاحب اینجا هست";

    const ADMIN_PASS =
        "M9!vR2#qL7@xP4$z";


    /* =====================================================
       Toast
    ===================================================== */

    const showToast = (
        msg,
        type = "success"
    ) => {

        setToast({
            msg,
            type
        });

    };


    /* =====================================================
       آپلود فایل
    ===================================================== */

    const handleFileUpload = (file) => {

        return new Promise((resolve, reject) => {

            if (!file) {

                resolve({
                    name: "",
                    data: ""
                });

                return;
            }

            const reader =
                new FileReader();

            reader.onload = () => {

                resolve({
                    name: file.name,
                    data: reader.result
                });

            };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        });
    };


    /* =====================================================
       کپی شماره کارت
    ===================================================== */

    const copyCardNumber = async () => {

        try {

            await navigator.clipboard.writeText(
                CARD_NUMBER
            );

            showToast(
                "شماره کارت با موفقیت کپی شد 📋"
            );

        } catch {

            showToast(
                "کپی خودکار انجام نشد؛ شماره کارت را دستی کپی کنید.",
                "error"
            );

        }
    };


    /* =====================================================
       ثبت نام
    ===================================================== */

    const handleSignupStep1 = (formData) => {

        if (
            state.users.some(
                u => u.phone === formData.phone
            ) ||
            state.users.some(
                u => u.username === formData.username
            )
        ) {

            showToast(
                "شماره تماس یا نام کاربری قبلاً ثبت شده است.",
                "error"
            );

            return;
        }


        if (
            formData.password !==
            formData.confirmPassword
        ) {

            showToast(
                "رمزهای عبور یکسان نیستند.",
                "error"
            );

            return;
        }


        const code =
            Math.floor(
                100000 +
                Math.random() * 900000
            ).toString();


        setState(prev => ({

            ...prev,

            otpRequests: [

                {
                    id:
                        Date.now().toString(),

                    phone:
                        formData.phone,

                    type:
                        "signup",

                    code,

                    formData,

                    createdAt:
                        new Date()
                        .toLocaleString("fa-IR"),

                    status:
                        "pending"
                },

                ...prev.otpRequests

            ]

        }));


        setPendingSignup({
            ...formData,
            code
        });


        setView("otp_verify");


        showToast(
            "کد تأیید برای تست ایجاد شد."
        );

    };


    /* =====================================================
       تأیید OTP
    ===================================================== */

    const handleVerifyOtp = (inputCode) => {

        if (
            pendingSignup &&
            inputCode === pendingSignup.code
        ) {

            const newUser = {

                id:
                    Date.now().toString(),

                name:
                    pendingSignup.name,

                phone:
                    pendingSignup.phone,

                username:
                    pendingSignup.username,

                passwordHash:
                    "hash_" +
                    pendingSignup.password,

                createdAt:
                    new Date()
                    .toLocaleDateString("fa-IR"),

                orderCount:
                    0
            };


            setState(prev => ({

                ...prev,

                users: [
                    ...prev.users,
                    newUser
                ],

                currentUser: newUser

            }));


            setPendingSignup(null);

            setView("welcome_user");

            showToast(
                "ثبت‌نام با موفقیت انجام شد 🎉"
            );

        } else {

            showToast(
                "کد تأیید اشتباه است.",
                "error"
            );

        }

    };


    /* =====================================================
       ورود
    ===================================================== */

    const handleLogin = (
        username,
        password
    ) => {

        if (
            username.trim() ===
            ADMIN_USER.trim() &&
            password === ADMIN_PASS
        ) {

            setState(prev => ({

                ...prev,

                currentUser: {

                    username:
                        ADMIN_USER,

                    name:
                        "مدیر کل",

                    role:
                        "admin"
                }

            }));

            setView("admin_dashboard");

            showToast(
                "خوش آمدید مدیر محترم 👑"
            );

            return;
        }


        const user =
            state.users.find(
                u =>
                    u.username === username &&
                    u.passwordHash ===
                    "hash_" + password
            );


        if (user) {

            setState(prev => ({

                ...prev,

                currentUser: {
                    ...user,
                    role: "user"
                }

            }));

            setView("school");

            showToast(
                `خوش آمدید ${user.name}`
            );

        } else {

            showToast(
                "❌ نام کاربری یا رمز عبور اشتباه است.",
                "error"
            );

        }

    };


    /* =====================================================
       شروع پرداخت
    ===================================================== */

    const startPayment = (product) => {

        if (!state.currentUser) {

            showToast(
                "لطفاً ابتدا وارد حساب خود شوید.",
                "error"
            );

            setView("login");

            return;
        }


        setSelectedProduct(product);

        setView("gateway_redirect");

    };


    /* =====================================================
       ثبت سفارش + رسید
    ===================================================== */

    const createOrder = async (
        receiptFile
    ) => {

        if (
            !selectedProduct ||
            !state.currentUser
        ) {

            showToast(
                "اطلاعات سفارش کامل نیست.",
                "error"
            );

            return;
        }


        if (!receiptFile) {

            showToast(
                "لطفاً تصویر رسید را انتخاب کنید.",
                "error"
            );

            return;
        }


        try {

            const receipt =
                await handleFileUpload(
                    receiptFile
                );


            const order = {

                id:
                    "ORD-" +
                    Date.now(),

                username:
                    state.currentUser.username,

                userId:
                    state.currentUser.id,

                userName:
                    state.currentUser.name,

                phone:
                    state.currentUser.phone,

                title:
                    selectedProduct.title,

                price:
                    selectedProduct.price,

                fileName:
                    selectedProduct.fileName ||
                    "download.zip",

                fileData:
                    selectedProduct.fileData ||
                    "",

                receiptName:
                    receipt.name,

                receiptData:
                    receipt.data,

                date:
                    new Date()
                    .toLocaleString("fa-IR"),

                status:
                    "در انتظار بررسی"
            };


            setState(prev => ({

                ...prev,

                orders: [
                    order,
                    ...prev.orders
                ]

            }));


            showToast(
                "رسید با موفقیت ارسال شد. منتظر بررسی مدیر باشید."
            );


            setView("user_panel");

        } catch (error) {

            console.error(error);

            showToast(
                "ارسال رسید ناموفق بود.",
                "error"
            );

        }

    };


    /* =====================================================
       دانلود فایل
    ===================================================== */

    const downloadFile = (
        order
    ) => {

        if (
            order.status !==
            "تأیید شده"
        ) {

            showToast(
                "ابتدا باید رسید شما توسط مدیر تأیید شود.",
                "error"
            );

            return;
        }


        if (!order.fileData) {

            showToast(
                "فایل این محصول موجود نیست.",
                "error"
            );

            return;
        }


        const a =
            document.createElement("a");

        a.href =
            order.fileData;

        a.download =
            order.fileName;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);


        showToast(
            "دانلود فایل آغاز شد 📥"
        );

    };


    /* =====================================================
       تأیید سفارش
    ===================================================== */

    const approveOrder = (
        orderId
    ) => {

        setState(prev => ({

            ...prev,

            orders:
                prev.orders.map(order =>

                    order.id === orderId

                        ? {
                            ...order,
                            status:
                                "تأیید شده"
                        }

                        : order
                )

        }));


        showToast(
            "رسید تأیید شد و دانلود برای کاربر فعال شد ✅"
        );

    };


    /* =====================================================
       رد سفارش
    ===================================================== */

    const rejectOrder = (
        orderId
    ) => {

        setState(prev => ({

            ...prev,

            orders:
                prev.orders.map(order =>

                    order.id === orderId

                        ? {
                            ...order,
                            status:
                                "رد شده"
                        }

                        : order
                )

        }));


        showToast(
            "رسید رد شد ❌",
            "error"
        );

    };


    /* =====================================================
       فیلتر محصولات
    ===================================================== */

    const filteredSchoolPacks =
        state.schoolPacks.filter(
            p =>
                schoolGradeFilter === "همه" ||
                p.grade === schoolGradeFilter
        );


    const filteredAiPacks =
        state.aiPacks.filter(
            p =>
                aiCategoryFilter === "همه" ||
                p.category === aiCategoryFilter
        );


    /* =====================================================
       تعداد سفارش‌های در انتظار
    ===================================================== */

    const pendingOrders =
        state.orders.filter(
            o =>
                o.status ===
                "در انتظار بررسی"
        ).length;


    return (

        <div className="min-h-screen flex flex-col justify-between">

            <div>

                {/* =================================================
                    HEADER
                ================================================= */}

                <header className="sticky top-0 z-40 glass border-b border-slate-200 shadow-sm">

                    <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

                        <div className="flex items-center gap-6">

                            <button
                                onClick={() =>
                                    setView("welcome")
                                }
                                className="text-xl font-black bg-gradient-to-r from-indigo-600 to-sky-500 bg-clip-text text-transparent"
                            >
                                آکادمی هوش برتر
                            </button>


                            <nav className="hidden md:flex items-center gap-2">

                                <button
                                    onClick={() =>
                                        setView("school")
                                    }
                                    className="px-3 py-2 text-sm font-semibold"
                                >
                                    📚 درس و مدرسه
                                </button>


                                <button
                                    onClick={() =>
                                        setView("ai")
                                    }
                                    className="px-3 py-2 text-sm font-semibold"
                                >
                                    🤖 دنیای AI
                                </button>


                                <button
                                    onClick={() =>
                                        setView("rules")
                                    }
                                    className="px-3 py-2 text-sm font-semibold text-slate-600"
                                >
                                    قوانین و مقررات
                                </button>

                            </nav>

                        </div>


                        <div>

                            {state.currentUser ? (

                                <div className="flex items-center gap-2">

                                    {state.currentUser.role === "admin" ? (

                                        <button
                                            onClick={() =>
                                                setView("admin_dashboard")
                                            }
                                            className="relative bg-amber-50 text-slate-900 px-4 py-2 rounded-xl text-sm font-bold shadow"
                                        >

                                            🛡️ پنل مدیریت

                                            {pendingOrders > 0 && (

                                                <span className="absolute -top-2 -left-2 bg-rose-600 text-white text-[10px] min-w-5 h-5 rounded-full flex items-center justify-center">
                                                    {pendingOrders}
                                                </span>

                                            )}

                                        </button>

                                    ) : (

                                        <button
                                            onClick={() =>
                                                setView("user_panel")
                                            }
                                            className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold"
                                        >
                                            👤 پنل کاربری
                                        </button>

                                    )}


                                    <button
                                        onClick={() => {

                                            setState(prev => ({
                                                ...prev,
                                                currentUser: null
                                            }));

                                            setView("welcome");

                                        }}
                                        className="text-rose-500 p-2 text-sm font-bold"
                                    >
                                        خروج
                                    </button>

                                </div>

                            ) : (

                                <div className="flex items-center gap-2">

                                    <button
                                        onClick={() =>
                                            setView("login")
                                        }
                                        className="text-slate-700 text-sm font-semibold px-2"
                                    >
                                        ورود
                                    </button>


                                    <button
                                        onClick={() =>
                                            setView("signup")
                                        }
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold"
                                    >
                                        ثبت‌نام
                                    </button>

                                </div>

                            )}

                        </div>

                    </div>

                </header>


                {/* =================================================
                    WELCOME
                ================================================= */}

                {view === "welcome" && (

                    <div className="max-w-5xl mx-auto px-4 py-16 text-center">

                        <h1 className="text-4xl font-black text-slate-900 mb-6">
                            به آکادمی هوش برتر خوش آمدید ✨
                        </h1>


                        <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">

                            <div
                                onClick={() =>
                                    setView("school")
                                }
                                className="bg-white p-8 rounded-3xl border shadow-xl text-right cursor-pointer hover:border-emerald-500 transition"
                            >

                                <div className="text-3xl mb-4">
                                    📚
                                </div>

                                <h2 className="text-2xl font-bold mb-2">
                                    درس و مدرسه
                                </h2>

                                <p className="text-slate-500 text-sm">
                                    پایه‌های چهارم تا هفتم، جزوه، آزمون و نمونه سوال
                                </p>

                            </div>


                            <div
                                onClick={() =>
                                    setView("ai")
                                }
                                className="bg-white p-8 rounded-3xl border shadow-xl text-right cursor-pointer hover:border-purple-500 transition"
                            >

                                <div className="text-3xl mb-4">
                                    🤖
                                </div>

                                <h2 className="text-2xl font-bold mb-2">
                                    دنیای AI
                                </h2>

                                <p className="text-slate-500 text-sm">
                                    پرامپت‌ها، آموزش هوش مصنوعی و دوره‌های آموزشی
                                </p>

                            </div>

                        </div>

                    </div>

                )}


                {/* =================================================
                    SIGNUP
                ================================================= */}

                {view === "signup" && (

                    <div className="max-w-md mx-auto my-12 p-8 bg-white rounded-3xl shadow-xl border">

                        <h2 className="text-2xl font-bold text-center mb-6">
                            ثبت‌نام کاربران
                        </h2>


                        <form
                            onSubmit={e => {

                                e.preventDefault();

                                const f =
                                    new FormData(e.target);

                                handleSignupStep1({

                                    name:
                                        f.get("name"),

                                    phone:
                                        f.get("phone"),

                                    username:
                                        f.get("username"),

                                    password:
                                        f.get("password"),

                                    confirmPassword:
                                        f.get("confirmPassword")

                                });

                            }}
                            className="space-y-4"
                        >

                            <div>

                                <label className="text-xs font-bold block mb-1">
                                    نام و نام خانوادگی
                                </label>

                                <input
                                    required
                                    name="name"
                                    className="w-full p-3 border rounded-xl text-sm"
                                />

                            </div>


                            <div>

                                <label className="text-xs font-bold block mb-1">
                                    شماره تماس
                                </label>

                                <input
                                    required
                                    name="phone"
                                    className="w-full p-3 border rounded-xl text-sm"
                                    placeholder="09123456789"
                                />

                            </div>


                            <div>

                                <label className="text-xs font-bold block mb-1">
                                    نام کاربری
                                </label>

                                <input
                                    required
                                    name="username"
                                    className="w-full p-3 border rounded-xl text-sm"
                                />

                            </div>


                            <div>

                                <label className="text-xs font-bold block mb-1">
                                    رمز عبور
                                </label>

                                <input
                                    required
                                    type="password"
                                    name="password"
                                    className="w-full p-3 border rounded-xl text-sm"
                                />

                            </div>


                            <div>

                                <label className="text-xs font-bold block mb-1">
                                    تکرار رمز
                                </label>

                                <input
                                    required
                                    type="password"
                                    name="confirmPassword"
                                    className="w-full p-3 border rounded-xl text-sm"
                                />

                            </div>


                            <button
                                type="submit"
                                className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl"
                            >
                                دریافت کد تأیید
                            </button>

                        </form>

                    </div>

                )}


                {/* =================================================
                    OTP
                ================================================= */}

                {view === "otp_verify" && (

                    <div className="max-w-md mx-auto my-12 p-8 bg-white rounded-3xl shadow-xl text-center border">

                        <h2 className="text-xl font-bold mb-6">
                            تأیید شماره همراه
                        </h2>


                        <form
                            onSubmit={e => {

                                e.preventDefault();

                                handleVerifyOtp(
                                    e.target.code.value
                                );

                            }}
                            className="space-y-4"
                        >

                            <input
                                required
                                name="code"
                                maxLength="6"
                                className="w-full text-center text-2xl font-bold p-3 border rounded-xl"
                                placeholder="------"
                            />


                            <button
                                type="submit"
                                className="w-full bg-amber-500 text-white font-bold py-3 rounded-xl"
                            >
                                تأیید کد
                            </button>

                        </form>

                    </div>

                )}


                {/* =================================================
                    WELCOME USER
                ================================================= */}

                {view === "welcome_user" && (

                    <div className="max-w-xl mx-auto my-16 p-8 bg-white rounded-3xl text-center border shadow-lg">

                        <h2 className="text-2xl font-bold">
                            🎉 خوش اومدی، {state.currentUser?.name}!
                        </h2>

                        <p className="my-4 text-slate-600 text-sm">
                            ثبت‌نام شما با موفقیت تکمیل شد ❤️
                        </p>


                        <button
                            onClick={() =>
                                setView("school")
                            }
                            className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold"
                        >
                            ورود به بخش دروس
                        </button>

                    </div>

                )}


                {/* =================================================
                    LOGIN

                                className="p-3 border rounded-xl mb-4 text-xs w-full outline-none"
                            />


                            <div className="overflow-x-auto">

                                <table className="w-full text-right text-xs">

                                    <thead className="bg-slate-50">

                                        <tr>

                                            <th className="p-3">
                                                نام
                                            </th>

                                            <th className="p-3">
                                                نام کاربری
                                            </th>

                                            <th className="p-3">
                                                شماره تماس
                                            </th>

                                            <th className="p-3">
                                                سفارش
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody className="divide-y">

                                        {state.users
                                            .filter(
                                                u =>
                                                    u.name.includes(searchTerm) ||
                                                    u.username.includes(searchTerm) ||
                                                    u.phone.includes(searchTerm)
                                            )
                                            .map(u => (

                                                <tr key={u.id}>

                                                    <td className="p-3">
                                                        {u.name}
                                                    </td>

                                                    <td className="p-3">
                                                        {u.username}
                                                    </td>

                                                    <td className="p-3 font-bold text-amber-700">
                                                        {u.phone}
                                                    </td>

                                                    <td className="p-3">
                                                        {u.orderCount || 0}
                                                    </td>

                                                </tr>

                                            ))}

                                    </tbody>

                                </table>

                            </div>

                        </div>


                        {/* =============================================
                            OTP
                        ============================================= */}

                        <div className="bg-white p-6 rounded-2xl border mb-6">

                            <h3 className="font-bold mb-3">
                                🔑 صندوق کدهای تأیید
                            </h3>


                            {state.otpRequests.length === 0 ? (

                                <p className="text-xs text-slate-400">
                                    کدی وجود ندارد.
                                </p>

                            ) : (

                                state.otpRequests.map(r => (

                                    <div
                                        key={r.id}
                                        className="p-3 border rounded-xl flex justify-between items-center gap-3 text-xs my-2"
                                    >

                                        <span>
                                            {r.phone}
                                        </span>


                                        <span className="font-bold text-indigo-600 font-mono text-sm">
                                            {r.code}
                                        </span>


                                        <button
                                            onClick={() =>
                                                showToast(
                                                    `کد ${r.code} مجدداً ارسال شد`
                                                )
                                            }
                                            className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg"
                                        >
                                            ارسال مجدد
                                        </button>

                                    </div>

                                ))

                            )}

                        </div>


                        {/* =============================================
                            ADD SCHOOL PRODUCT
                        ============================================= */}

                        <div className="bg-white p-6 rounded-2xl border mb-6">

                            <h3 className="font-bold mb-4">
                                📚 افزودن محصول درسی + فایل
                            </h3>


                            <form
                                onSubmit={async e => {

                                    e.preventDefault();

                                    const f =
                                        new FormData(e.target);

                                    const fileInput =
                                        e.target.querySelector(
                                            'input[type="file"]'
                                        );

                                    const file =
                                        fileInput.files[0];

                                    const uploaded =
                                        await handleFileUpload(file);


                                    setState(prev => ({

                                        ...prev,

                                        schoolPacks: [

                                            {
                                                id:
                                                    "s" +
                                                    Date.now(),

                                                title:
                                                    f.get("title"),

                                                grade:
                                                    f.get("grade"),

                                                subject:
                                                    f.get("subject"),

                                                price:
                                                    parseInt(
                                                        f.get("price")
                                                    ),

                                                desc:
                                                    f.get("desc"),

                                                fileName:
                                                    uploaded.name ||
                                                    "file.pdf",

                                                fileData:
                                                    uploaded.data

                                            },

                                            ...prev.schoolPacks

                                        ]

                                    }));


                                    showToast(
                                        "محصول درسی اضافه شد ✅"
                                    );


                                    e.target.reset();

                                }}
                                className="grid grid-cols-2 gap-3 text-xs"
                            >

                                <input
                                    required
                                    name="title"
                                    placeholder="عنوان محصول"
                                    className="p-3 border rounded-xl"
                                />


                                <input
                                    required
                                    name="subject"
                                    placeholder="نام درس"
                                    className="p-3 border rounded-xl"
                                />


                                <input
                                    required
                                    name="price"
                                    type="number"
                                    placeholder="قیمت به تومان"
                                    className="p-3 border rounded-xl"
                                />


                                <select
                                    name="grade"
                                    className="border p-3 rounded-xl bg-white"
                                >

                                    <option>
                                        پایه چهارم
                                    </option>

                                    <option>
                                        پایه پنجم
                                    </option>

                                    <option>
                                        پایه ششم
                                    </option>

                                    <option>
                                        پایه هفتم
                                    </option>

                                </select>


                                <input
                                    required
                                    name="desc"
                                    placeholder="توضیحات"
                                    className="p-3 border rounded-xl col-span-2"
                                />


                                <div className="col-span-2 border border-dashed border-emerald-400 p-5 rounded-xl bg-emerald-50">

                                    <label className="block font-bold text-emerald-800 mb-2">
                                        📁 فایل محصول
                                    </label>

                                    <input
                                        required
                                        type="file"
                                        className="text-xs bg-white p-2 rounded-lg border w-full"
                                    />

                                </div>


                                <button
                                    type="submit"
                                    className="col-span-2 bg-emerald-600 text-white font-bold py-3 rounded-xl"
                                >
                                    ➕ ذخیره محصول درسی
                                </button>

                            </form>

                        </div>


                        {/* =============================================
                            ADD AI PRODUCT
                        ============================================= */}

                        <div className="bg-white p-6 rounded-2xl border mb-6">

                            <h3 className="font-bold mb-4">
                                🤖 افزودن محصول هوش مصنوعی + فایل
                            </h3>


                            <form
                                onSubmit={async e => {

                                    e.preventDefault();

                                    const f =
                                        new FormData(e.target);

                                    const fileInput =
                                        e.target.querySelector(
                                            'input[type="file"]'
                                        );

                                    const file =
                                        fileInput.files[0];

                                    const uploaded =
                                        await handleFileUpload(file);


                                    setState(prev => ({

                                        ...prev,

                                        aiPacks: [

                                            {
                                                id:
                                                    "a" +
                                                    Date.now(),

                                                title:
                                                    f.get("title"),

                                                category:
                                                    f.get("category"),

                                                price:
                                                    parseInt(
                                                        f.get("price")
                                                    ),

                                                desc:
                                                    f.get("desc"),

                                                fileName:
                                                    uploaded.name ||
                                                    "pack.zip",

                                                fileData:
                                                    uploaded.data

                                            },

                                            ...prev.aiPacks

                                        ]

                                    }));


                                    showToast(
                                        "محصول AI اضافه شد ✅"
                                    );


                                    e.target.reset();

                                }}
                                className="grid grid-cols-2 gap-3 text-xs"
                            >

                                <input
                                    required
                                    name="title"
                                    placeholder="عنوان محصول"
                                    className="p-3 border rounded-xl"
                                />


                                <input
                                    required
                                    name="price"
                                    type="number"
                                    placeholder="قیمت به تومان"
                                    className="p-3 border rounded-xl"
                                />


                                <select
                                    name="category"
                                    className="border p-3 rounded-xl bg-white col-span-2"
                                >

                                    <option>
                                        پرامپت
                                    </option>

                                    <option>
                                        دوره AI
                                    </option>

                                    <option>
                                        آموزش InShot
                                    </option>

                                </select>


                                <input
                                    required
                                    name="desc"
                                    placeholder="توضیحات"
                                    className="p-3 border rounded-xl col-span-2"
                                />


                                <div className="col-span-2 border border-dashed border-purple-400 p-5 rounded-xl bg-purple-50">

                                    <label className="block font-bold text-purple-800 mb-2">
                                        📁 فایل محصول
                                    </label>

                                    <input
                                        required
                                        type="file"
                                        className="text-xs bg-white p-2 rounded-lg border w-full"
                                    />

                                </div>


                                <button
                                    type="submit"
                                    className="col-span-2 bg-purple-600 text-white font-bold py-3 rounded-xl"
                                >
                                    ➕ ذخیره محصول AI
                                </button>

                            </form>

                        </div>

                    </div>

                )}

            </div>


            {/* =================================================
                FOOTER
            ================================================= */}

            <footer className="bg-slate-900 text-slate-300 border-t border-slate-800 mt-16 text-xs">

                <div className="max-w-7xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-2 gap-8">

                    <div className="space-y-3">

                        <h3 className="text-white font-bold text-sm">
                            آکادمی هوش برتر
                        </h3>

                        <p className="leading-relaxed text-slate-400">
                            مرکز تخصصی فروش فایل‌های آموزشی،
                            جزوات و دوره‌های هوش مصنوعی.
                        </p>

                    </div>


                    <div>

                        <h4 className="text-white font-bold mb-3">
                            دسترسی سریع
                        </h4>

                        <ul className="space-y-2">

                            <li>
                                <button
                                    onClick={() =>
                                        setView("school")
                                    }
                                    className="hover:text-white"
                                >
                                    دروس مدرسه
                                </button>
                            </li>


                            <li>
                                <button
                                    onClick={() =>
                                        setView("ai")
                                    }
                                    className="hover:text-white"
                                >
                                    دوره‌های AI
                                </button>
                            </li>


                            <li>
                                <button
                                    onClick={() =>
                                        setView("rules")
                                    }
                                    className="hover:text-white"
                                >
                                    قوانین و مقررات
                                </button>
                            </li>

                        </ul>

                    </div>

                </div>


                <div className="border-t border-slate-800 text-center py-4 text-[11px] text-slate-500">

                    تمامی حقوق مادی و معنوی این وب‌سایت متعلق به آکادمی هوش برتر می‌باشد.

                </div>

            </footer>


            {toast && (

                <Toast
                    msg={toast.msg}
                    type={toast.type}
                    onClose={() =>
                        setToast(null)
                    }
                />

            )}

        </div>

    );

}


/* =========================================================
   اجرای React
========================================================= */

ReactDOM
    .createRoot(
        document.getElementById("root")
    )
    .render(
        <App />
    );

</script>

</body>
    </html>
