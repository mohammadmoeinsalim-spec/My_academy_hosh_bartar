<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی برتر | آموزش، فایل و هوش مصنوعی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' },
                        ai: { 500: '#8b5cf6', 600: '#7c3aed' },
                        school: { 500: '#10b981', 600: '#059669' }
                    },
                    fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const INITIAL_STATE = {
            currentUser: null, users: [], otpRequests: [], schoolPacks: [], aiPacks: [],
            orders: [], messages: [], reviews: []
        };
        function Toast({ msg, type, onClose }) {
            useEffect(() => { const timer = setTimeout(onClose, 3500); return () => clearTimeout(timer); }, []);
            return (
                <div className={`fixed bottom-5 left-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-3 animate-bounce ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                    <span>{msg}</span><button onClick={onClose} className="hover:opacity-75">✕</button>
                </div>
            );
        }
        function App() {
            const [state, setState] = useState(() => { try { const local = localStorage.getItem('academy_bartar_v1'); return local ? JSON.parse(local) : INITIAL_STATE; } catch (e) { return INITIAL_STATE; } });
            const [view, setView] = useState('welcome'); const [toast, setToast] = useState(null); const [pendingSignup, setPendingSignup] = useState(null); const [selectedProduct, setSelectedProduct] = useState(null); const [searchTerm, setSearchTerm] = useState('');
            const [schoolGradeFilter, setSchoolGradeFilter] = useState('همه');
            const [aiCategoryFilter, setAiCategoryFilter] = useState('همه');
            
            useEffect(() => { try { localStorage.setItem('academy_bartar_v1', JSON.stringify(state)); } catch (e) { console.error(e); } }, [state]);
            const showToast = (msg, type = 'success') => setToast({ msg, type });
            
            const ADMIN_USER = "admin"; const ADMIN_PASS = "admin123";

            const handleLogin = (username, password) => {
                if (username === ADMIN_USER && password === ADMIN_PASS) { setState(prev => ({ ...prev, currentUser: { username: ADMIN_USER, name: 'مدیر کل', role: 'admin' } })); setView('admin_dashboard'); showToast('خوش آمدید مدیر محترم 👑'); return; }
                const user = state.users.find(u => u.username === username && u.passwordHash === 'hash_' + password);
                if (user) { setState(prev => ({ ...prev, currentUser: { ...user, role: 'user' } })); setView('school'); showToast(`خوش آمدید ${user.name}`); } else { showToast('❌ نام کاربری یا رمز عبور اشتباه است.', 'error'); }
            };

            const filteredSchoolPacks = state.schoolPacks.filter(p => schoolGradeFilter === 'همه' || p.grade === schoolGradeFilter);
            const filteredAiPacks = state.aiPacks.filter(p => aiCategoryFilter === 'همه' || p.category === aiCategoryFilter);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <header className="sticky top-0 z-40 glass border-b border-slate-200 shadow-sm"><div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><div className="flex items-center gap-6"><button onClick={() => setView('welcome')} className="text-xl font-black bg-gradient-to-r from-indigo-600 to-sky-500 bg-clip-text text-transparent">آکادمی برتر</button><nav className="hidden md:flex items-center gap-2"><button onClick={() => setView('school')} className="px-3 py-2 text-sm font-semibold">📚 درس و مدرسه</button><button onClick={() => setView('ai')} className="px-3 py-2 text-sm font-semibold">🤖 دنیای AI</button></nav></div><div>{state.currentUser ? <div className="flex items-center gap-2">{state.currentUser.role === 'admin' ? <button onClick={() => setView('admin_dashboard')} className="bg-amber-50 text-slate-900 px-4 py-2 rounded-xl text-sm font-bold shadow">🛡️ پنل مدیریت</button> : <button onClick={() => setView('user_panel')} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold">👤 پنل کاربری</button>}<button onClick={() => { setState(prev => ({ ...prev, currentUser: null })); setView('welcome'); }} className="text-rose-500 p-2 text-sm font-bold">خروج</button></div> : <div className="flex items-center gap-2"><button onClick={() => setView('login')} className="text-slate-700 text-sm font-semibold px-2">ورود</button></div>}</div></div></header>
                        
                        {view === 'welcome' && <div className="max-w-5xl mx-auto px-4 py-16 text-center"><h1 className="text-4xl font-black text-slate-900 mb-6">به آکادمی برتر خوش آمدید ✨</h1><div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto"><div onClick={() => setView('school')} className="bg-white p-8 rounded-3xl border shadow-xl text-right cursor-pointer hover:border-emerald-500 transition"><div className="text-3xl mb-4">📚</div><h2 className="text-2xl font-bold mb-2">درس و مدرسه</h2><p className="text-slate-500 text-sm">پایه‌های چهارم تا نهم (جزوه، آزمون، شب امتحان)</p></div><div onClick={() => setView('ai')} className="bg-white p-8 rounded-3xl border shadow-xl text-right cursor-pointer hover:border-purple-500 transition"><div className="text-3xl mb-4">🤖</div><h2 className="text-2xl font-bold mb-2">دنیای AI</h2><p className="text-slate-500 text-sm">پرامپت‌ها، آموزش هوش مصنوعی و دوره InShot</p></div></div></div>}
                        {view === 'login' && <div className="max-w-md mx-auto my-12 p-8 bg-white rounded-3xl shadow-xl border"><h2 className="text-2xl font-bold text-center mb-6">ورود مدیر</h2><form onSubmit={(e) => { e.preventDefault(); handleLogin(e.target.username.value, e.target.password.value); }} className="space-y-4"><input required name="username" placeholder="نام کاربری" className="w-full p-3 border rounded-xl" /><input type="password" required name="password" placeholder="رمز عبور" className="w-full p-3 border rounded-xl" /><button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">ورود</button></form></div>}
                        
                        {view === 'school' && (
                            <div className="max-w-7xl mx-auto px-4 py-8">
                                <div className="bg-emerald-600 text-white p-8 rounded-3xl mb-8 flex justify-between items-center">
                                    <div><h1 className="text-2xl font-black">📚 درس و مدرسه</h1><p className="text-xs opacity-90 mt-1">جزوات و نمونه سوالات تحصیلی</p></div>
                                </div>
                                <div className="flex gap-2 mb-6 overflow-x-auto no-scrollbar py-2 border-b">
                                    {['همه', 'پایه چهارم', 'پایه پنجم', 'پایه ششم', 'پایه هفتم', 'پایه هشتم', 'پایه نهم'].map(g => (
                                        <button key={g} onClick={() => setSchoolGradeFilter(g)} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${schoolGradeFilter === g ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-600'}`}>{g}</button>
                                    ))}
                                </div>
                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{filteredSchoolPacks.map(p => <div key={p.id} className="bg-white border rounded-2xl p-4 shadow-sm"><span className="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded">{p.grade}</span><h3 className="font-bold text-lg mt-2">{p.title}</h3><div className="border-t pt-3 mt-3"><span>{p.price.toLocaleString()} تومان</span></div></div>)}</div>
                            </div>
                        )}
                        
                        {view === 'ai' && (
                            <div className="max-w-7xl mx-auto px-4 py-8">
                                <div className="bg-purple-600 text-white p-8 rounded-3xl mb-8">
                                    <h1 className="text-2xl font-black">🤖 دنیای AI & هوش مصنوعی</h1>
                                </div>
                                <div className="flex gap-2 mb-6 overflow-x-auto no-scrollbar py-2 border-b">
                                    {['همه', 'پرامپت', 'دوره AI', 'آموزش InShot'].map(c => (
                                        <button key={c} onClick={() => setAiCategoryFilter(c)} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${aiCategoryFilter === c ? 'bg-purple-600 text-white' : 'bg-white border text-slate-600'}`}>{c}</button>
                                    ))}
                                </div>
                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{filteredAiPacks.map(p => <div key={p.id} className="bg-white border rounded-2xl p-4 shadow-sm"><span className="text-[10px] bg-purple-50 text-purple-700 font-bold px-2 py-0.5 rounded">{p.category}</span><h3 className="font-bold text-lg mt-2">{p.title}</h3><div className="border-t pt-3 mt-3"><span>{p.price.toLocaleString()} تومان</span></div></div>)}</div>
                            </div>
                        )}

                        {view === 'admin_dashboard' && state.currentUser?.role === 'admin' && (
                            <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                                <div className="bg-white p-6 rounded-2xl border">
                                    <h3 className="font-bold mb-3">📚 افزودن پک درسی</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); setState(prev => ({ ...prev, schoolPacks: [{ id: 's' + Date.now(), title: f.get('title'), grade: f.get('grade'), price: parseInt(f.get('price')) }, ...prev.schoolPacks] })); showToast('اضافه شد'); }} className="grid grid-cols-2 gap-3 text-xs">
                                        <input name="title" placeholder="عنوان" required className="p-2 border rounded-xl" />
                                        <input name="price" type="number" placeholder="قیمت" required className="p-2 border rounded-xl" />
                                        <select name="grade" className="border p-2 rounded-xl"><option>پایه چهارم</option><option>پایه پنجم</option><option>پایه ششم</option><option>پایه هفتم</option><option>پایه هشتم</option><option>پایه نهم</option></select>
                                        <button type="submit" className="bg-emerald-600 text-white font-bold p-2 rounded-xl col-span-2">ثبت</button>
                                    </form>
                                </div>
                                <div className="bg-white p-6 rounded-2xl border">
                                    <h3 className="font-bold mb-3">🤖 افزودن محصول AI (پرامپت/InShot)</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); setState(prev => ({ ...prev, aiPacks: [{ id: 'a' + Date.now(), title: f.get('title'), category: f.get('category'), price: parseInt(f.get('price')) }, ...prev.aiPacks] })); showToast('اضافه شد'); }} className="grid grid-cols-2 gap-3 text-xs">
                                        <input name="title" placeholder="عنوان" required className="p-2 border rounded-xl" />
                                        <input name="price" type="number" placeholder="قیمت" required className="p-2 border rounded-xl" />
                                        <select name="category" className="border p-2 rounded-xl col-span-2"><option>پرامپت</option><option>دوره AI</option><option>آموزش InShot</option></select>
                                        <button type="submit" className="bg-purple-600 text-white font-bold p-2 rounded-xl col-span-2">ثبت</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                    {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
